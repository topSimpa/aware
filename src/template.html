<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./images/ui/favicon.ico" type="image/x-icon" />
    <title>Aware</title>
  </head>
  <body>
    <dialog id="loading-component"></dialog>
    <header>
      <section class="brand-content">
        <img id="logo" src="./images/ui/logo.svg" alt="logo" />
        <h1>Aware</h1>
      </section>
      <section class="search-content">
        <form id="city-form" novalidate>
          <div class="inputbox">
            <input
              id="city-input"
              name="city"
              placeholder="Enter a city"
              required
            />
            <span id="form-error"></span>
          </div>
          <button id="submit" type="submit">Get Weather</button>
        </form>
      </section>
      <button id="user-location">
        <img src="./images/ui/location.svg" alt="icon" />
        Use location
      </button>
    </header>
    <main>
      <section class="current-content">
        <div class="cards current-conditions">
          <div id="summary-card"></div>
        </div>
        <div class="cards two-column air-conditions">
          <h5>AIR CONDITIONS</h5>
          <div id="air-condition-card"></div>
        </div>
        <div class="cards two-column forecast-today">
          <h5>TODAY'S FORECAST</h5>
          <div id="todays-forecast-card"></div>
        </div>
      </section>
      <section class="cards week-content">
        <div class="two-column forecast-week">
          <h5>NEXT 7-DAYS FORECAST</h5>
          <div id="week-forecast-card"></div>
        </div>
        <ul class="contact">
          <li class="github">
            <a>
              <img src="./images/ui/github.svg" alt="github" />
            </a>
          </li>
          <li class="linkedin">
            <a>
              <img src="./images/ui/linkedin.svg" alt="linkedin" />
            </a>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
